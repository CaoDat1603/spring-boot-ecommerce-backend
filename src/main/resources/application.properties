spring.application.name=ecommerce
spring.profiles.default=local

spring.datasource.hikari.connection-init-sql=SET timezone='Asia/Ho_Chi_Minh'
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=myuser
spring.datasource.password=secret

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true


logging.level.org.flywaydb=TRACE
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

jwt.secret=my-super-secret-key-for-ecommerce-2026
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

stripe.secret-key=${STRIPE_SECRET_KEY}
